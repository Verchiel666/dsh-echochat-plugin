# 把本插件插进 profile 的层栈。App 里安装后重启引擎生效。
# name 用包名（本机 pnpm 装好后由 Loader 解析），不要写 !!js。
- insert:
    - id: echochat
      name: dsh-echochat-plugin
      config:
        # 走引擎自己的 ctx.llm，不需要 API key。
        # 默认是本机实测到的 app 账号路由；换设备可改，或留空由工具自动挑。
        provider: deepseek-account
        model: deepseek-flash
        tau: 0.6
        # 900 不够：judge 的 reasoning + trace 会把 JSON 截断（真机实测三轮全在重试）
        maxTokens: 2000
        # 每条候选采样几次取中位数。单次采样会让近分候选的胜负在轮次间翻转
        samples: 2
        # 前两名差距小于它就宣布并列，不硬选
        tieMargin: 0.05
